<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyMusic - IndexedDB Offline Player</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg: #09090c;
    --card: #15151a;
    --card2: #1c1c22;
    --text: #ffffff;
    --secondary: #9999a3;
    --accent: #8b6cff;
    --accent-hover: #7a5af5;
    --danger: #ff4d4d;
    --border: rgba(255,255,255,.08);
}
body { background: var(--bg); color: var(--text); font-family: Arial, sans-serif; min-height: 100vh; }
button { font-family: inherit; cursor: pointer; }

/* HEADER & MAIN */
.header { height: 70px; padding: 0 30px; display: flex; align-items: center; border-bottom: 1px solid var(--border); }
.logo { font-size: 24px; font-weight: 800; }
.logo span { color: var(--accent); }

.main { max-width: 900px; margin: auto; padding: 30px 20px 150px; }

/* ADD & SEARCH FORMS */
.add-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 25px;
}
.add-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; }
.add-methods { display: flex; flex-direction: column; gap: 12px; }

.url-form { display: flex; gap: 10px; flex-wrap: wrap; }
.input-field {
    flex: 1; min-width: 180px; height: 44px;
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 10px; color: white; padding: 0 14px; outline: none; font-size: 14px;
}
.input-field:focus { border-color: var(--accent); }

.btn {
    height: 44px; padding: 0 20px;
    background: var(--accent); color: white;
    border: 0; border-radius: 10px; font-weight: bold; font-size: 14px;
    transition: background 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { background: var(--accent-hover); }

.search-box { display: flex; gap: 10px; margin-bottom: 25px; }

.section-title { font-size: 20px; margin-bottom: 15px; }
.song-list { display: flex; flex-direction: column; gap: 8px; }

.song {
    display: grid; grid-template-columns: 50px 1fr auto auto;
    gap: 15px; align-items: center; padding: 10px;
    background: var(--card); border-radius: 12px; cursor: pointer; transition: background .15s;
}
.song:hover { background: var(--card2); }
.cover { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #222; }
.song-info { min-width: 0; }
.song-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-artist { color: var(--secondary); font-size: 13px; margin-top: 3px; }

.btn-delete {
    background: transparent; border: 0; color: var(--secondary); font-size: 18px; padding: 5px 10px;
}
.btn-delete:hover { color: var(--danger); }

/* PLAYER BAR */
.player {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(21, 21, 26, 0.96); backdrop-filter: blur(15px);
    border-top: 1px solid var(--border); padding: 15px 30px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px; z-index: 100;
}
.player-info { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.player-cover { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; display: none; }
.player-text { min-width: 0; }
.player-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-artist { color: var(--secondary); font-size: 12px; margin-top: 2px; }

.controls { display: flex; align-items: center; gap: 15px; }
.btn-play {
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: var(--accent); color: white; font-weight: bold;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.btn-play:hover { background: var(--accent-hover); }

.progress-area { flex: 1; max-width: 400px; display: flex; align-items: center; gap: 10px; }
.progress { flex: 1; height: 4px; appearance: none; background: #333; border-radius: 4px; cursor: pointer; }
.progress::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: white; }
.time { font-size: 12px; color: var(--secondary); }
</style>
</head>
<body>

<header class="header">
    <div class="logo">My<span>Music</span></div>
</header>

<main class="main">
    <div class="add-panel">
        <div class="add-title">➕ Добавить музыку (Сохраняется навсегда)</div>
        <div class="add-methods">
            <div>
                <label class="btn">
                    📁 Загрузить MP3 с устройства
                    <input type="file" id="fileInput" accept="audio/mp3,audio/*" style="display: none;">
                </label>
            </div>
            
            <form class="url-form" id="urlForm">
                <input class="input-field" id="trackTitleInput" type="text" placeholder="Название трека" required>
                <input class="input-field" id="trackArtistInput" type="text" placeholder="Исполнитель">
                <input class="input-field" id="trackUrlInput" type="url" placeholder="Прямая URL-ссылка на .mp3" required>
                <button class="btn" type="submit">Добавить ссылку</button>
            </form>
        </div>
    </div>

    <div class="search-box">
        <input class="input-field" id="searchInput" type="text" placeholder="Поиск по медиатеке...">
    </div>

    <h2 class="section-title">Моя медиатека</h2>
    <div class="song-list" id="songList"></div>
</main>

<div class="player">
    <div class="player-info">
        <img class="player-cover" id="playerCover" alt="">
        <div class="player-text">
            <div class="player-title" id="playerTitle">Выберите трек</div>
            <div class="player-artist" id="playerArtist">—</div>
        </div>
    </div>

    <div class="progress-area">
        <span class="time" id="currentTime">0:00</span>
        <input class="progress" id="progress" type="range" min="0" max="100" value="0">
        <span class="time" id="duration">0:00</span>
    </div>

    <div class="controls">
        <button class="btn-play" id="playBtn">▶</button>
    </div>
</div>

<audio id="audio"></audio>

<script>
// --- ИНИЦИАЛИЗАЦИЯ INDEXEDDB (Хранилище больших файлов) ---
let db;
const request = indexedDB.open("MusicPlayerDB", 1);

request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("tracks")) {
        db.createObjectStore("tracks", { keyPath: "id" });
    }
};

request.onsuccess = (e) => {
    db = e.target.result;
    loadTracksFromDB(); // Загружаем все сохраненные файлы при запуске
};

request.onerror = () => {
    console.error("Ошибка при открытии базы данных IndexedDB");
};

let TRACKS = [];
let currentTrackIndex = -1;
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');

// Загрузка треков из базы браузера
function loadTracksFromDB() {
    const tx = db.transaction("tracks", "readonly");
    const store = tx.objectStore("tracks");
    const getAll = store.getAll();

    getAll.onsuccess = () => {
        TRACKS = getAll.result || [];
        renderSongs(TRACKS);
    };
}

// Сохранение трека в базу IndexedDB
function saveTrackToDB(trackObj) {
    const tx = db.transaction("tracks", "readwrite");
    const store = tx.objectStore("tracks");
    store.put(trackObj);
    
    tx.oncomplete = () => {
        loadTracksFromDB();
    };
}

// Удаление трека из базы IndexedDB
function deleteTrack(id, e) {
    e.stopPropagation(); // Чтобы не запускался трек при клике на крестик
    if (!confirm("Удалить этот трек?")) return;

    const tx = db.transaction("tracks", "readwrite");
    const store = tx.objectStore("tracks");
    store.delete(id);

    tx.oncomplete = () => {
        loadTracksFromDB();
    };
}

function renderSongs(list) {
    const container = document.getElementById('songList');
    container.innerHTML = '';

    if (list.length === 0) {
        container.innerHTML = `<div style="color: var(--secondary); text-align: center; padding: 40px;">Медиатека пуста. Загрузите MP3 с устройства!</div>`;
        return;
    }

    list.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = 'song';
        item.innerHTML = `
            <img class="cover" src="${track.cover || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200&auto=format&fit=crop'}" alt="">
            <div class="song-info">
                <div class="song-title">${escapeHtml(track.title)}</div>
                <div class="song-artist">${escapeHtml(track.artist || 'Сохраненный файл')}</div>
            </div>
            <div style="color: var(--secondary); font-size: 13px;">${track.file ? 'В памяти' : 'URL'}</div>
            <button class="btn-delete" title="Удалить">✕</button>
        `;
        
        item.querySelector('.btn-delete').onclick = (e) => deleteTrack(track.id, e);
        item.onclick = () => playTrack(index);
        container.appendChild(item);
    });
}

function playTrack(index) {
    if (!TRACKS[index]) return;
    currentTrackIndex = index;
    const track = TRACKS[currentTrackIndex];

    // Если у нас сохранен бинарный файл (Blob/File) - создаем URL для него
    if (track.file) {
        audio.src = URL.createObjectURL(track.file);
    } else {
        audio.src = track.src;
    }

    document.getElementById('playerTitle').textContent = track.title;
    document.getElementById('playerArtist').textContent = track.artist || '—';
    
    const coverImg = document.getElementById('playerCover');
    coverImg.src = track.cover || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200&auto=format&fit=crop';
    coverImg.style.display = 'block';

    audio.play();
    playBtn.textContent = '❚❚';
}

playBtn.onclick = () => {
    if (!audio.src && TRACKS.length > 0) return playTrack(0);
    if (audio.paused) {
        audio.play();
        playBtn.textContent = '❚❚';
    } else {
        audio.pause();
        playBtn.textContent = '▶';
    }
};

// Прогресс бар и время
audio.ontimeupdate = () => {
    if (!audio.duration) return;
    document.getElementById('progress').value = (audio.currentTime / audio.duration) * 100;
    document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
    document.getElementById('duration').textContent = formatTime(audio.duration);
};

document.getElementById('progress').oninput = (e) => {
    if (audio.duration) {
        audio.currentTime = (e.target.value / 100) * audio.duration;
    }
};

function formatTime(s) {
    if (!s || !isFinite(s)) return "0:00";
    return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
}

function escapeHtml(str) {
    return String(str).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
}

// 1. Загрузка и постоянное сохранение MP3-файла в IndexedDB
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const newTrack = {
        id: Date.now(),
        title: file.name.replace(/\.[^/.]+$/, ""),
        artist: "Локальный трек",
        file: file, // Полностью сохраняем файл в IndexedDB
        cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200&auto=format&fit=crop"
    };

    saveTrackToDB(newTrack);
    this.value = '';
});

// 2. Добавление трека по прямой URL-ссылке
document.getElementById('urlForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const title = document.getElementById('trackTitleInput').value.trim();
    const artist = document.getElementById('trackArtistInput').value.trim();
    const url = document.getElementById('trackUrlInput').value.trim();

    if (!title || !url) return;

    const newTrack = {
        id: Date.now(),
        title: title,
        artist: artist || "Онлайн трек",
        src: url,
        cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=200&auto=format&fit=crop"
    };

    saveTrackToDB(newTrack);

    document.getElementById('trackTitleInput').value = '';
    document.getElementById('trackArtistInput').value = '';
    document.getElementById('trackUrlInput').value = '';
});

// Поиск
document.getElementById('searchInput').oninput = (e) => {
    const q = e.target.value.toLowerCase().trim();
    const filtered = TRACKS.filter(t => t.title.toLowerCase().includes(q) || (t.artist && t.artist.toLowerCase().includes(q)));
    renderSongs(filtered);
};
</script>

</body>
</html>
