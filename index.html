<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyMusic</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #09090c;
    --card: #15151a;
    --card2: #1c1c22;
    --text: #ffffff;
    --secondary: #9999a3;
    --accent: #8b6cff;
    --accent-hover: #7a5af5;
    --border: rgba(255,255,255,.08);
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

button {
    font-family: inherit;
    cursor: pointer;
}

svg {
    display: block;
}

/* ================= HEADER ================= */

.header {
    height: 70px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.logo span {
    color: var(--accent);
}

.add-button {
    border: 0;
    background: var(--accent);
    color: #fff;
    padding: 10px 16px;
    min-height: 40px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    transition: background 0.2s;
}

.add-button:hover {
    background: var(--accent-hover);
}

/* ================= MAIN ================= */

.main {
    max-width: 1200px;
    margin: auto;
    padding: 25px 30px 150px;
}

.search {
    width: 100%;
    height: 48px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: white;
    padding: 0 18px;
    font-size: 15px;
    outline: none;
}

.search:focus {
    border-color: var(--accent);
}

/* ================= FILTERS ================= */

.filters {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
}

.filter {
    border: 1px solid var(--border);
    background: var(--card);
    color: white;
    padding: 9px 15px;
    border-radius: 10px;
    font-size: 14px;
}

.filter.active {
    background: white;
    color: #09090c;
}

/* ================= SONG LIST ================= */

.section-title {
    font-size: 22px;
    margin: 20px 0 15px;
}

.song-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.song {
    display: grid;
    grid-template-columns: 55px minmax(0, 1fr) auto;
    gap: 15px;
    align-items: center;

    width: 100%;
    min-width: 0;

    padding: 9px;
    border-radius: 13px;

    transition: background .15s;
}

.song:hover {
    background: var(--card);
}

.cover {
    width: 55px;
    height: 55px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--card2);
}

.song-info {
    min-width: 0;
    overflow: hidden;
}

.song-title {
    display: block;

    width: 100%;

    font-size: 15px;
    line-height: 20px;
    font-weight: 600;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-artist {
    display: block;

    width: 100%;

    color: var(--secondary);
    font-size: 13px;
    line-height: 18px;

    margin-top: 3px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-duration {
    color: var(--secondary);
    font-size: 13px;
    white-space: nowrap;
}

.empty {
    text-align: center;
    padding: 70px 20px;
    color: var(--secondary);
}

/* ================= MINI PLAYER ================= */

.mini-player {
    position: fixed;
    left: 20px;
    right: 20px;
    bottom: 20px;

    height: 74px;

    background: rgba(22,22,27,.96);
    backdrop-filter: blur(20px);

    border: 1px solid var(--border);
    border-radius: 18px;

    z-index: 50;

    display: none;
    align-items: center;

    padding: 10px 15px;
    gap: 12px;
}

.mini-cover {
    width: 52px;
    height: 52px;

    flex: 0 0 52px;

    border-radius: 8px;
    object-fit: cover;
}

.mini-info {
    flex: 1;
    min-width: 0;
    overflow: hidden;
}

.mini-title {
    font-size: 14px;
    font-weight: 600;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.mini-artist {
    color: var(--secondary);
    font-size: 12px;

    margin-top: 3px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.mini-controls {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
}

.icon-button {
    width: 40px;
    height: 40px;

    flex: 0 0 40px;

    border: 0;
    background: transparent;
    color: white;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;
}

.icon-button:hover {
    background: rgba(255,255,255,.1);
}

.icon-button svg {
    width: 21px;
    height: 21px;
}

.mini-play {
    background: white;
    color: #09090c;
}

.mini-play:hover {
    background: #eeeeee;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav {
    display: none;
}

/* ================= FULL PLAYER ================= */

.full-player {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 20%,
            #24202f,
            transparent 40%
        ),
        #09090c;

    z-index: 100;

    display: none;
    flex-direction: column;

    padding: 25px;
}

.full-player.open {
    display: flex;
}

.full-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.full-top button {
    width: 44px;
    height: 44px;

    border: 0;
    background: transparent;
    color: white;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;
}

.full-top button:hover {
    background: rgba(255,255,255,.1);
}

.full-top svg {
    width: 24px;
    height: 24px;
}

.full-content {
    width: min(500px, 100%);
    margin: auto;

    display: flex;
    flex-direction: column;
    align-items: center;
}

.full-cover {
    width: min(390px, 80vw);
    aspect-ratio: 1;

    border-radius: 18px;
    object-fit: cover;

    box-shadow: 0 30px 80px rgba(0,0,0,.5);
}

.full-info {
    width: 100%;
    margin-top: 30px;
    overflow: hidden;
}

.full-title {
    width: 100%;

    font-size: 27px;
    line-height: 32px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.full-artist {
    color: var(--secondary);

    margin-top: 7px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.progress-area {
    width: 100%;
    margin-top: 28px;
}

.progress {
    width: 100%;
    height: 5px;

    appearance: none;

    background: #404047;
    border-radius: 5px;

    cursor: pointer;
}

.progress::-webkit-slider-thumb {
    appearance: none;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: white;
}

.progress-time {
    display: flex;
    justify-content: space-between;

    color: var(--secondary);
    font-size: 12px;

    margin-top: 7px;
}

.full-controls {
    width: 100%;

    margin-top: 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 25px;
}

.full-control {
    width: 46px;
    height: 46px;

    flex: 0 0 46px;

    border: 0;
    background: transparent;

    color: #fff;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        background .15s,
        transform .15s;
}

.full-control:hover {
    background: rgba(255,255,255,.10);
}

.full-control:active {
    transform: scale(.9);
}

.full-control svg {
    width: 22px;
    height: 22px;
}

#fullShuffle,
#fullRepeat {
    color: #fff;
}

#fullShuffle.active,
#fullRepeat.active {
    background: rgba(255,255,255,.14);
    color: #fff;
}

.full-play {
    width: 66px;
    height: 66px;

    flex: 0 0 66px;

    border: 0;
    border-radius: 50%;

    background: #fff;
    color: #09090c;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: transform .15s;
}

.full-play:hover {
    background: #eeeeee;
}

.full-play:active {
    transform: scale(.92);
}

.full-play svg {
    width: 27px;
    height: 27px;
}

/* ================= MODAL & FILE INPUT STYLES ================= */

.modal {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.7);
    backdrop-filter: blur(8px);

    z-index: 200;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.modal.open {
    display: flex;
}

.modal-box {
    width: min(500px, 100%);

    background: #17171c;

    border: 1px solid var(--border);
    border-radius: 20px;

    padding: 25px;
}

.modal-box h2 {
    margin-bottom: 20px;
}

/* Стилизация области загрузки и кнопки Browse */
.file-dropzone {
    width: 100%;
    padding: 30px 20px;
    border: 2px dashed #44444d;
    border-radius: 16px;
    text-align: center;
    background: rgba(255, 255, 255, 0.02);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: border-color 0.2s, background 0.2s;
}

.file-dropzone:hover {
    border-color: var(--accent);
    background: rgba(139, 108, 255, 0.05);
}

.file-input-hidden {
    display: none;
}

.browse-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--card2);
    border: 1px solid var(--border);
    color: #ffffff;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}

.browse-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 4px 15px rgba(139, 108, 255, 0.3);
}

.file-selected-text {
    font-size: 13px;
    color: var(--secondary);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;

    gap: 10px;

    margin-top: 20px;
}

.modal-button {
    border: 0;

    padding: 11px 18px;

    border-radius: 10px;

    background: var(--card2);
    color: white;
}

.modal-button.primary {
    background: var(--accent);
}

/* ================= CONTEXT MENU ================= */

.context-menu {
    position: fixed;

    display: none;

    background: #202027;

    border: 1px solid var(--border);
    border-radius: 10px;

    overflow: hidden;

    z-index: 300;
}

.context-menu button {
    display: block;

    width: 170px;

    border: 0;
    background: transparent;

    color: white;

    text-align: left;

    padding: 12px 15px;
}

.context-menu button:hover {
    background: rgba(255,255,255,.1);
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .header {
        height: 60px;
        padding: 0 15px;
    }

    .logo {
        font-size: 21px;
    }

    .add-button {
        padding: 9px 13px;
        min-height: 38px;
        font-size: 13px;
    }

    .main {
        padding: 18px 15px 150px;
    }

    .filters {
        margin: 16px 0;
    }

    .section-title {
        margin-top: 18px;
    }

    .song {
        grid-template-columns: 50px minmax(0, 1fr) auto;
        gap: 12px;

        padding: 8px;
    }

    .cover {
        width: 50px;
        height: 50px;
    }

    .song-title {
        font-size: 14px;
        line-height: 19px;
    }

    .song-artist {
        font-size: 12px;
        line-height: 17px;
    }

    .song-duration {
        font-size: 12px;
    }

    .mini-player {
        left: 10px;
        right: 10px;
        bottom: 65px;

        height: 67px;

        padding: 9px 10px;
    }

    .mini-cover {
        width: 46px;
        height: 46px;
        flex-basis: 46px;
    }

    .mini-info {
        max-width: none;
    }

    .mini-title {
        font-size: 13px;
    }

    .mini-controls {
        gap: 0;
    }

    .mini-controls .icon-button {
        width: 35px;
        height: 35px;
        flex-basis: 35px;
    }

    .bottom-nav {
        position: fixed;

        left: 0;
        right: 0;
        bottom: 0;

        height: 60px;

        background: rgba(15,15,19,.97);

        border-top: 1px solid var(--border);

        display: flex;
        justify-content: space-around;
        align-items: center;

        z-index: 60;
    }

    .bottom-nav button {
        border: 0;
        background: transparent;

        color: var(--secondary);

        display: flex;
        flex-direction: column;
        align-items: center;

        gap: 3px;

        font-size: 10px;
    }

    .bottom-nav button.active {
        color: white;
    }

    .bottom-nav svg {
        width: 21px;
        height: 21px;
    }

    .full-player {
        padding: 18px;
    }

    .full-cover {
        width: min(340px, 82vw);
    }

    .full-controls {
        gap: 10px;
    }

    .full-title {
        font-size: 23px;
        line-height: 28px;
    }
}

@media (max-width: 400px) {

    .full-controls {
        gap: 5px;
    }

    .full-control {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
    }

    .full-play {
        width: 60px;
        height: 60px;
        flex-basis: 60px;
    }

}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        My<span>Music</span>
    </div>

    <button class="add-button" id="openAdd">
        + Добавить
    </button>

</header>


<main class="main">

    <input
        class="search"
        id="search"

        placeholder="Поиск музыки..."
    >

    <div class="filters">

        <button class="filter active" id="allFilter">

        </button>

<!-- MINI PLAYER -->

    </button>

</nav>


<!-- FULL PLAYER -->

<div class="full-player" id="fullPlayer">

    <div class="full-top">

        <button id="closeFull">

            <svg viewBox="0 0 24 24">
                <path
                    d="M6 9l6 6 6-6"

            </button>


            <button
                class="full-play"
                id="fullPlay"
                aria-label="Воспроизведение"

                class="full-control"
                id="fullNext"
                aria-label="Следующая"
            >

                <svg viewBox="0 0 24 24">

                    <path
                        d="M19 5v14M5 6l8 6-8 6z"
                        fill="currentColor"
                    />

                </svg>

            </button>


            <button
                class="full-control"
                id="fullRepeat"

            >

                <svg viewBox="0 0 24 24">

                    <path
                        d="M17 2l4 4-4 4
                           M3 11V9a3 3 0 0 1 3-3h15
                           M7 22l-4-4 4-4
                           M21 13v2a3 3 0 0 1-3 3H3"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

            </button>

        </div>

    </div>

</div>


<!-- ADD MODAL -->

<div class="modal" id="addModal">

    <div class="modal-box">

        <h2>
            Добавить музыку
        </h2>

        <div class="file-dropzone">
            <input
                class="file-input-hidden"
                id="audioFiles"
                type="file"
                accept="audio/*"
                multiple
            >

            <label for="audioFiles" class="browse-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                Browse / Обзор
            </label>

            <div class="file-selected-text" id="fileSelectedText">
                Файлы не выбраны
            </div>
        </div>

        <div class="modal-buttons">

            <button
                class="modal-button"
                id="cancelAdd"
            >
                Отмена
            </button>

            <button
                class="modal-button primary"
                id="confirmAdd"
            >
                Добавить
            </button>

        </div>

    </div>

</div>


<!-- CONTEXT MENU -->

<div class="context-menu" id="contextMenu">

    <button id="deleteSong">
        Удалить
    </button>

</div>


<audio id="audio"></audio>


<script>

/* =========================================================
   DATABASE
========================================================= */

const DB_NAME = "MyMusicDB";
const DB_VERSION = 1;
const STORE = "songs";

let db;

const request = indexedDB.open(
    DB_NAME,
    DB_VERSION
);

request.onupgradeneeded = event => {

    db = event.target.result;

    if (!db.objectStoreNames.contains(STORE)) {

        db.createObjectStore(
            STORE,
            {
                keyPath: "id",
                autoIncrement: true
            }
        );

    }

};

request.onsuccess = event => {

    db = event.target.result;

    loadSongs();

};

request.onerror = () => {

    console.error(
        "IndexedDB error"
    );

};


/* =========================================================
   STATE
========================================================= */

let songs = [];
let currentIndex = -1;

let shuffle = false;
let repeat = false;

let currentObjectURL = null;


/* =========================================================
   DEFAULT COVER
========================================================= */

function defaultCover(title = "Music") {

    const canvas =
        document.createElement("canvas");

    canvas.width = 600;
    canvas.height = 600;

    const ctx =
        canvas.getContext("2d");

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            600,
            600
        );

    gradient.addColorStop(
        0,
        "#8b6cff"
    );

    gradient.addColorStop(
        1,
        "#14141a"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        600,
        600
    );

    ctx.fillStyle = "white";

    ctx.font =
        "bold 150px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "♪",
        300,
        300
    );

    return canvas.toDataURL(
        "image/jpeg",
        .85
    );

}


/* =========================================================
   TEXT DECODER
========================================================= */

function decodeText(data) {

    if (
        !data ||
        data.length === 0
    ) {
        return "";
    }

    const encoding =
        data[0];

    let bytes =
        data.slice(1);


    while (
        bytes.length &&
        bytes[bytes.length - 1] === 0
    ) {

        bytes =
            bytes.slice(
                0,
                -1
            );

    }


    try {

        if (encoding === 1) {

            return new TextDecoder(
                "utf-16"
            )
                .decode(bytes)
                .replace(/\0/g, "")
                .trim();

        }


        if (encoding === 2) {

            return new TextDecoder(
                "utf-16be"
            )
                .decode(bytes)
                .replace(/\0/g, "")
                .trim();

        }


        if (encoding === 3) {

            return new TextDecoder(
                "utf-8"
            )
                .decode(bytes)
                .replace(/\0/g, "")
                .trim();

        }


        return new TextDecoder(
            "iso-8859-1"
        )
            .decode(bytes)
            .replace(/\0/g, "")
            .trim();

    } catch {

        return "";

    }

}


/* =========================================================
   SYNC SAFE INTEGER
========================================================= */

function syncSafe(bytes) {

    return (
        (bytes[0] & 0x7f) * 2097152 +
        (bytes[1] & 0x7f) * 16384 +
        (bytes[2] & 0x7f) * 128 +
        (bytes[3] & 0x7f)
    );

}


/* =========================================================
   ID3
========================================================= */

async function readMetadata(file) {

    const result = {

        title:
            file.name.replace(
                /\.[^/.]+$/,
                ""
            ),

        artist:
            "Неизвестный исполнитель",

        album: "",

        cover: null

    };


    const buffer =
        await file.arrayBuffer();

    const bytes =
        new Uint8Array(buffer);


    if (
        bytes.length < 10 ||
        String.fromCharCode(
            bytes[0],
            bytes[1],
            bytes[2]
        ) !== "ID3"
    ) {

        result.cover =
            defaultCover(
                result.title
            );

        return result;

    }


    const version =
        bytes[3];

    const tagSize =
        syncSafe(
            bytes.slice(
                6,
                10
            )
        );


    let position = 10;

    const tagEnd =
        Math.min(
            bytes.length,
            10 + tagSize
        );


    while (
        position + 10 <= tagEnd
    ) {

        const frameId =
            String.fromCharCode(
                bytes[position],
                bytes[position + 1],
                bytes[position + 2],
                bytes[position + 3]
            );


        if (
            !frameId ||
            frameId === "\0\0\0\0"
        ) {
            break;
        }


        let frameSize;


        if (version === 4) {

            frameSize =
                syncSafe(
                    bytes.slice(
                        position + 4,
                        position + 8
                    )
                );

        } else {

            frameSize =
                bytes[position + 4] * 16777216 +
                bytes[position + 5] * 65536 +
                bytes[position + 6] * 256 +
                bytes[position + 7];

        }


        if (
            frameSize <= 0 ||
            position + 10 + frameSize >
            bytes.length
        ) {
            break;
        }


        const frameData =
            bytes.slice(
                position + 10,
                position + 10 + frameSize
            );


        if (
            frameId === "TIT2"
        ) {

            const value =
                decodeText(
                    frameData
                );

            if (value) {
                result.title =
                    value;
            }

        }


        if (
            frameId === "TPE1"
        ) {

            const value =
                decodeText(
                    frameData
                );

            if (value) {
                result.artist =
                    value;
            }

        }


        if (
            frameId === "TALB"
        ) {

            const value =
                decodeText(
                    frameData
                );

            if (value) {
                result.album =
                    value;
            }

        }


        if (
            frameId === "APIC"
        ) {

            try {

                const encoding =
                    frameData[0];

                let pos = 1;


                while (
                    pos < frameData.length &&
                    frameData[pos] !== 0
                ) {
                    pos++;
                }

                pos++;


                const mimeStart =
                    pos;


                while (
                    pos < frameData.length &&
                    frameData[pos] !== 0
                ) {
                    pos++;
                }


                const mime =
                    new TextDecoder()
                        .decode(
                            frameData.slice(
                                mimeStart,
                                pos
                            )
                        );


                pos++;

                pos++;


                if (
                    encoding === 0 ||
                    encoding === 3
                ) {

                    while (
                        pos < frameData.length &&
                        frameData[pos] !== 0
                    ) {
                        pos++;
                    }

                    pos++;

                } else {

                    while (
                        pos + 1 <
                        frameData.length &&
                        !(
                            frameData[pos] === 0 &&
                            frameData[pos + 1] === 0
                        )
                    ) {
                        pos += 2;
                    }

                    pos += 2;

                }


                const imageBytes =
                    frameData.slice(pos);


                const blob =
                    new Blob(
                        [imageBytes],
                        {
                            type:
                                mime ||
                                "image/jpeg"
                        }
                    );


                result.cover =
                    URL.createObjectURL(
                        blob
                    );

            } catch {

                result.cover = null;

            }

        }


        position +=
            10 + frameSize;

    }


    if (!result.cover) {

        result.cover =
            defaultCover(
                result.title
            );

    }


    return result;

}


/* =========================================================
   DATABASE
========================================================= */

function addSong(song) {

    return new Promise(
        (resolve, reject) => {

            const tx =
                db.transaction(
                    STORE,
                    "readwrite"
                );

            tx.objectStore(STORE)
                .add(song);

            tx.oncomplete =
                resolve;

            tx.onerror =
                reject;

        }
    );

}


function deleteSongFromDB(id) {

    return new Promise(
        (resolve, reject) => {

            const tx =
                db.transaction(
                    STORE,
                    "readwrite"
                );

            tx.objectStore(STORE)
                .delete(id);

            tx.oncomplete =
                resolve;

            tx.onerror =
                reject;

        }
    );

}


function getAllSongs() {

    return new Promise(
        (resolve, reject) => {

            const tx =
                db.transaction(
                    STORE,
                    "readonly"
                );

            const request =
                tx.objectStore(
                    STORE
                ).getAll();

            request.onsuccess =
                () => {

                    resolve(
                        request.result
                    );

                };

            request.onerror =
                reject;

        }
    );

}

   LOAD
========================================================= */

async function loadSongs() {

    songs =
        await getAllSongs();

    renderSongs();

}


/* =========================================================
   RENDER
========================================================= */

function renderSongs() {

    const list =
        document.getElementById(
            "songList"
        );


    const query =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    list.innerHTML = "";


    const filtered =
        songs.filter(song => {

            return (
                song.title
                    .toLowerCase()
                    .includes(query) ||

                song.artist
                    .toLowerCase()
                    .includes(query)
            );

        });


    if (
        filtered.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">

                ${
                    songs.length === 0
                    ? "Музыки пока нет.<br>Нажми «+ Добавить»."
                    : "Ничего не найдено."
                }

            </div>

        `;

        return;

    }


    filtered.forEach(song => {

        const index =
            songs.findIndex(
                s =>
                    s.id === song.id
            );


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "song";


        item.innerHTML = `

            <img
                class="cover"
                src="${song.cover}"
                alt=""
            >

            <div class="song-info">

                <div class="song-title">
                    ${escapeHtml(song.title)}
                </div>

                <div class="song-artist">
                    ${escapeHtml(song.artist)}
                </div>

            </div>

            <div class="song-duration">
                ${song.duration || ""}
            </div>

        `;


        item.onclick =
            () => playSong(index);


        item.oncontextmenu =
            event => {

                event.preventDefault();

                openContextMenu(
                    event.clientX,
                    event.clientY,
                    song.id
                );

            };


        list.appendChild(item);

    });

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}

/* =========================================================
   ADD FILES
========================================================= */

document
    .getElementById(
        "confirmAdd"
    )
    .onclick = async () => {

        const input =
            document.getElementById(
                "audioFiles"
            );


        const files =
            Array.from(
                input.files
            );


        if (!files.length) {
            return;
        }


        for (
            const file of files
        ) {

            try {

                const metadata =
                    await readMetadata(
                        file
                    );


                const duration =
                    await getAudioDuration(
                        file
                    );


                await addSong({

                    title:
                        metadata.title,

                    artist:
                        metadata.artist,

                    album:
                        metadata.album,

                    cover:
                        metadata.cover,

                    duration:
                        formatTime(
                            duration
                        ),

                    file:
                        file,

                    created:
                        Date.now()

                });

            } catch (error) {

                console.error(
                    error
                );

            }

        }


        input.value = "";
        document.getElementById("fileSelectedText").textContent = "Файлы не выбраны";

        closeAddModal();

        await loadSongs();

    };


function getAudioDuration(file) {

    return new Promise(
        resolve => {

            const audio =
                document.createElement(
                    "audio"
                );


            const url =
                URL.createObjectURL(
                    file
                );


            audio.src = url;


            audio.addEventListener(
                "loadedmetadata",
                () => {

                    const duration =
                        audio.duration;

                    URL.revokeObjectURL(
                        url
                    );

                    resolve(
                        duration
                    );

                }
            );


            audio.addEventListener(
                "error",
                () => {

                    URL.revokeObjectURL(
                        url
                    );

                    resolve(0);

                }
            );

        }
    );

}


/* =========================================================
   PLAY
========================================================= */

async function playSong(index) {

    if (!songs[index]) {
        return;
    }


    currentIndex =
        index;


    const song =
        songs[currentIndex];


    if (
        currentObjectURL
    ) {

        URL.revokeObjectURL(
            currentObjectURL
        );

    }


    currentObjectURL =
        URL.createObjectURL(
            song.file
        );


    const audio =
        document.getElementById(
            "audio"
        );


    audio.src =
        currentObjectURL;


    updatePlayer(
        song
    );


    try {

        await audio.play();

    } catch (error) {

        console.warn(
            error
        );

    }


    showMiniPlayer();

    updatePlayIcons();

    setupMediaSession();

}

/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay() {

    const audio =
        document.getElementById(
            "audio"
        );


    if (!audio.src) {

        if (songs.length) {

            playSong(
                currentIndex >= 0
                    ? currentIndex
                    : 0
            );

        }

        return;

    }


    if (audio.paused) {

        audio.play();

    } else {

        audio.pause();

    }


    updatePlayIcons();

}

/* =========================================================
   NEXT
========================================================= */

function nextSong() {

    if (!songs.length) {
        return;
    }


    let nextIndex;


    if (shuffle) {

        if (
            songs.length === 1
        ) {

            nextIndex = 0;

        } else {

            do {

                nextIndex =
                    Math.floor(
                        Math.random() *
                        songs.length
                    );

            } while (
                nextIndex ===
                currentIndex
            );

        }

    } else {

        nextIndex =
            (
                currentIndex + 1
            ) %
            songs.length;

    }


    playSong(
        nextIndex
    );

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousSong() {

    if (!songs.length) {
        return;
    }


    const audio =
        document.getElementById(
            "audio"
        );


    if (
        audio.currentTime > 3
    ) {

        audio.currentTime =
            0;

        return;

    }


    const previousIndex =
        (
            currentIndex -
            1 +
            songs.length
        ) %
        songs.length;


    playSong(
        previousIndex
    );

}

    .getElementById(
        "miniNext"
    )
    .onclick =
        nextSong;


document
    .getElementById(

    .onclick =

document
    .getElementById(

    )
    .onclick =
        previousSong;


document
    .getElementById(
        "fullPrev"
    )
    .onclick =
        previousSong;

);


/* =========================================================
   PROGRESS
========================================================= */

audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration) {
            return;
        }


        const percent =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        document.getElementById(
            "progress"
        ).value =
            percent;


        document.getElementById(
            "currentTime"
        ).textContent =
            formatTime(
                audio.currentTime
            );


        document.getElementById(
            "duration"
        ).textContent =
            formatTime(
                audio.duration
            );

    }
);


document
    .getElementById(
        "progress"
    )
    .addEventListener(
        "input",
        event => {

            if (!audio.duration) {
                return;
            }


            audio.currentTime =
                (
                    event.target.value /
                    100
                ) *
                audio.duration;

        }
    );


function formatTime(seconds) {

    if (
        !seconds ||
        !isFinite(seconds)
    ) {
        return "0:00";
    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        String(secs)
            .padStart(
                2,
                "0"
            )
    );

}

/* =========================================================
   MEDIA SESSION
========================================================= */

function setupMediaSession() {

    if (
        !("mediaSession" in navigator)
    ) {
        return;
    }


    const song =
        songs[currentIndex];


    if (!song) {
        return;
    }


    navigator.mediaSession.metadata =
        new MediaMetadata({

            title:
                song.title,

            artist:
                song.artist,

            album:
                song.album ||
                "MyMusic",

            artwork: [
                {
                    src:
                        song.cover,

                    sizes:
                        "512x512",

                    type:
                        "image/jpeg"
                }
            ]

        });


    try {

        navigator.mediaSession.setActionHandler(
            "play",
            () => audio.play()
        );


        navigator.mediaSession.setActionHandler(
            "pause",
            () => audio.pause()
        );


        navigator.mediaSession.setActionHandler(
            "previoustrack",
            previousSong
        );


        navigator.mediaSession.setActionHandler(
            "nexttrack",
            nextSong
        );

    } catch (error) {

        console.warn(
            error
        );

    }

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.code === "Space" &&
            document.activeElement.tagName !==
            "INPUT"
        ) {

            event.preventDefault();

            togglePlay();

        }


        if (
            event.code ===
            "ArrowRight"
        ) {

            if (audio.duration) {

                audio.currentTime =
                    Math.min(
                        audio.duration,
                        audio.currentTime + 5
                    );

            }

        }


        if (
            event.code ===
            "ArrowLeft"
        ) {

            if (audio.duration) {

                audio.currentTime =
                    Math.max(
                        0,
                        audio.currentTime - 5
                    );

            }
